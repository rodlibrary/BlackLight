# Site wording. Edit these rather than the views.
en:
  blacklight:
    application_name: 'Digital Collections'
    advanced_search:
      more_options: 'Advanced search'
  preservica:
    home:
      heading: 'Explore Digital Collections'
      intro: 'Search and browse the digitized and born-digital collections preserved in our Preservica repository.'
      collections: 'Collections'
      browse_all: 'Browse all'
      all_collections:
        one: 'See the collection'
        other: 'See all %{count} collections'
    about:
      nav: 'About'
      title: 'About Digital Collections'
      whats_here: 'What’s in Digital Collections'
      browse_collections: 'Browse the collections: Special Collections & University Archives and the Institutional Repository'
      viewing_heading: 'Viewing and downloading items'
      technology_heading: 'Technology'
      technology_intro: 'Digital Collections is built from open standards and open-source software, most of it shared and maintained by libraries and archives around the world.'
      harvester_text: 'A small Python program written for Rod Library. Each night it copies the descriptions of public items from %{systems} into Solr, along with folder structure and thumbnail images where a system has them. Items that are restricted or withdrawn at the source are removed from this site.'
      # Source systems, in the order the About page lists them. Each appears once its records are
      # in the index (the source_ssi value is the key). Add a key here when a new source is added.
      systems:
        preservica:
          name: 'Preservica'
          url: 'https://preservica.com/'
          text: 'The library’s digital preservation system, home of Special Collections & University Archives and the Institutional Repository. It stores the original files, checks them regularly so they stay intact, and keeps them readable as file formats change. Its public portal, Universal Access, is where you view and download items.'
        museumplus:
          name: 'MuseumPlus'
          url: 'https://www.zetcom.com/en/museumplus-en/'
          text: 'The UNI Museum’s collection management system, from zetcom. It holds the museum’s catalog of objects, art and botanical specimens; descriptions of the records the museum marks for public view are copied here.'
        scholarworks:
          name: 'UNI ScholarWorks'
          url: 'https://scholarworks.uni.edu/'
          text: 'Rod Library’s open-access repository for the research, scholarship and creative work of the UNI community, including journals and monographs. Its public records are copied here through OAI-PMH, and each links back to its ScholarWorks page and PDF.'
        janeway:
          name: 'Janeway'
          url: 'https://janeway.systems/'
          text: 'Open-source publishing software for journals, books and repositories. It publishes UNI’s journals and monographs; their records are copied here through OAI-PMH, and each links back to the article or book on Janeway.'
        archiveit:
          name: 'Archive-It'
          url: 'https://archive-it.org/'
          text: 'The Internet Archive’s web archiving service, which the library uses to capture websites before they change or disappear. Descriptions of the archived sites are copied here, and each links to its captures in Archive-It.'
      more_heading: 'For more information'
      more_text: 'See the'
      contact_heading: 'Contact us'
      contact_text: 'Questions about the collections or an item? Email us at'
      viewing_text: 'Use Digital Collections to search and browse. To view or download an item, choose Open in Preservica on its page. The item opens in a new tab in Preservica, the library’s digital preservation system. Items described in MODS also have a Download metadata button, which saves the item’s description as an XML file.'
    map:
      title: 'Map'
      link: 'Map'
      show_list: 'Show as a list'
      count:
        zero: 'No records in this search have a location.'
        one: '1 record with a location.'
        other: '%{count} records with locations.'
      too_many: 'The map shows the first %{max}; search or zoom in to narrow it.'
      in_area: 'Limited to the map area.'
      clear_area: 'Clear area'
      search_area: 'Search this area'
      item_heading: 'Location'
      georef_heading: 'Map overlay'
      opacity: 'Overlay transparency'
      allmaps_viewer: 'Open in Allmaps Viewer'
      georef_failed: 'The georeferenced map could not be loaded.'
      keyboard_help: 'Every record on the map is also in the list view. Use Tab to move between pins and Enter to open one.'
      skip_map: 'Skip past the map'
      coordinates:
        one: 'Coordinates (latitude, longitude):'
        other: 'Coordinates (latitude, longitude):'
    # Item and collection pages: the hand-off to Preservica's public portal (landing_url_template).
    handoff:
      new_tab: '(opens in a new tab)'
      viewer_link: 'Download or view in Preservica'
      note: 'Opens in a new tab. Close the tab or use Back to return here.'
      item:
        heading: 'View this item in Preservica'
        text: 'The full-resolution file and viewer are in Preservica, the library’s digital preservation system.'
        button: 'Open in Preservica'
      folder:
        heading: 'View this collection in Preservica'
        text: 'Browse the files in this collection in Preservica, the library’s digital preservation system.'
        button: 'Open in Preservica'
    # Record pages: the MODS download (MetadataDownloadComponent), for records harvested with MODS.
    metadata_download:
      heading: 'Metadata'
      button: 'Download metadata (MODS XML)'
      note: 'This item’s description in MODS, a library metadata standard, as an XML file.'

# Checks the Blacklight overlay files. The repository holds only the files that
# bin/setup_blacklight_app copies into a generated Rails app (there is no
# Gemfile here), so this checks Ruby, ERB and YAML syntax and validates the
# Solr configset XML rather than running an app test suite.

name: Blacklight overlay and Solr config

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'   # Blacklight 9 needs Ruby 3.2 or later
    - name: Check Ruby syntax
      run: find blacklight -name '*.rb' -print0 | xargs -0 -n1 ruby -wc
    - name: Unit test (About page source list)
      run: ruby test/blacklight/indexed_sources_test.rb
    - name: Unit test (MODS download)
      run: ruby test/blacklight/mods_export_test.rb
    - name: Check ERB templates compile
      run: |
        for f in $(find blacklight -name '*.erb'); do
          echo "$f"
          ruby -rerb -e 'puts ERB.new(File.read(ARGV[0]), trim_mode: "-").src' "$f" | ruby -c
        done
    - name: Check locale YAML
      run: for f in blacklight/config/locales/*.yml; do ruby -ryaml -e 'YAML.load_file(ARGV[0])' "$f"; done
    - name: Check setup script
      run: bash -n bin/setup_blacklight_app
    - name: Check Solr configset is well-formed
      run: |
        sudo apt-get install -y libxml2-utils >/dev/null
        xmllint --noout solr/conf/schema.xml solr/conf/solrconfig.xml

  solr:
    # Starts Solr with the configset and indexes the demo documents.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Start Solr
      run: docker compose up -d solr
    - name: Wait for the core
      run: |
        for i in $(seq 1 60); do
          curl -fs http://localhost:8983/solr/preservica/admin/ping && exit 0
          sleep 3
        done
        docker compose logs solr; exit 1
    - name: Index demo documents and query them
      run: |
        curl -fsS 'http://localhost:8983/solr/preservica/update?commit=true' \
          -H 'Content-Type: application/json' --data-binary @samples/demo-docs.json
        n=$(curl -fsS 'http://localhost:8983/solr/preservica/select?q=flood&rows=0&wt=json' | python3 -c 'import json,sys; print(json.load(sys.stdin)["response"]["numFound"])')
        echo "flood: $n hits"; test "$n" -ge 2
        # Map search: records with coordinates, and a "search this area" box (lower-left TO upper-right).
        m=$(curl -fsS 'http://localhost:8983/solr/preservica/select?q=*:*&rows=0&wt=json&fq=has_coordinates_bsi:true' | python3 -c 'import json,sys; print(json.load(sys.stdin)["response"]["numFound"])')
        echo "with coordinates: $m"; test "$m" -eq 2
        a=$(curl -fsS -G 'http://localhost:8983/solr/preservica/select' --data-urlencode 'q=*:*' --data-urlencode 'rows=0' --data-urlencode 'wt=json' \
          --data-urlencode 'fq=coordinates_srpt:[42.50,-92.50 TO 42.60,-92.40]' | python3 -c 'import json,sys; print(json.load(sys.stdin)["response"]["numFound"])')
        echo "in the Cedar Falls box: $a"; test "$a" -eq 1
        # Suggestions come back lowercased (KeywordTokenizer + LowerCaseFilter in textSuggest).
        # The About page lists source systems from this facet (IndexedSources).
        f=$(curl -fsS 'http://localhost:8983/solr/preservica/select?q=*:*&rows=0&wt=json&facet=true&facet.field=source_ssi&facet.mincount=1' | python3 -c 'import json,sys; print(json.load(sys.stdin)["facet_counts"]["facet_fields"]["source_ssi"])')
        echo "sources: $f"; echo "$f" | grep -q "'preservica', 7"
        # The MODS download is stored (mods_xml_ss) and comes back whole for the record page.
        x=$(curl -fsS 'http://localhost:8983/solr/preservica/select?q=id:preservica-a0000000-0000-4000-8000-000000000001&fl=mods_xml_ss&wt=json' | python3 -c 'import json,sys; print(json.load(sys.stdin)["response"]["docs"][0]["mods_xml_ss"])')
        echo "$x" | python3 -c 'import sys, xml.etree.ElementTree as ET; ET.fromstring(sys.stdin.read().strip().encode())'
        echo "$x" | grep -q 'Oral history interview with Grace Okafor'
        s=$(curl -fsS 'http://localhost:8983/solr/preservica/suggest?q=Okaf&suggest.build=true&wt=json')
        echo "$s"; echo "$s" | grep -qi okafor
